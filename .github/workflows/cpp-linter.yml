# .github/workflows/cpp-linter.yml
name: cpp-linter

on:
  # 1) Run linter on PR open/update
  pull_request:
    types: [opened, synchronize]
  # 2) Listen for the bot command in PR comments
  issue_comment:
    types: [created]

permissions:
  contents: write       # to push commits
  pull-requests: write  # to post reviews
  issues: write         # to read/write comments

jobs:
  cpp-linter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash -el {0}
    container:
      image: ghcr.io/llnl/ams-ci-almalinux8:latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          conda-remove-defaults: true

      - name: Create environment
        run: |
            conda install -y -q -c conda-forge \
            clang=18.1.3 \
            clangxx=18.1.3 \
            llvmdev=18.1.3 \
            clang-tools=18.1.3 \
            clang-format=18.1.3 \
            lit=18.1.3

      - name: Run cmake to export compilation database
        run: |
          module load gcc/11.2.1
          export SPACK_ROOT=/spack/
          source /spack/share/spack/setup-env.sh
          spack env activate -p /ams-spack-env
          rm -rf build/
          mkdir build
          cd build
          export AMS_MFEM_PATH=$(spack location -i mfem)
          export AMS_TORCH_PATH=$(spack location -i py-torch)/lib/python3.10/site-packages/torch/share/cmake/Torch
          export AMS_FAISS_PATH=$(spack location -i faiss)
          export AMS_HDF5_PATH=$(spack location -i hdf5)
          export AMS_AMQPCPP_PATH=$(spack location -i amqp-cpp)/cmake
          echo $AMS_MFEM_PATH
          cmake \
            -DBUILD_SHARED_LIBS=On \
            -DCMAKE_PREFIX_PATH=$INSTALL_DIR \
            -DWITH_CALIPER=On \
            -DWITH_HDF5=On \
            -DWITH_EXAMPLES=On \
            -DAMS_HDF5_DIR=$AMS_HDF5_PATH \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CUDA=Off \
            -DMFEM_DIR=$AMS_MFEM_PATH \
            -DWITH_FAISS=On \
            -DWITH_MPI=On \
            -DWITH_TORCH=On \
            -DWITH_TESTS=On \
            -DTorch_DIR=$AMS_TORCH_PATH \
            -DFAISS_DIR=$AMS_FAISS_PATH \
            -DWITH_AMS_DEBUG=On \
            -DWITH_WORKFLOW=On \
            -DWITH_RMQ=On \
            -Damqpcpp_DIR=$AMS_AMQPCPP_PATH \
            $GITHUB_WORKSPACE

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 18
          ignore: .github | scripts
          database: build
          extra-args: '-D__AMS_ENABLE_CALIPER__ -D__AMS_ENABLE_HDF5__ -D__AMS_ENABLE_MPI__ -D__AMS_ENABLE_RMQ__' 
          style: file
          tidy-checks: ''
          lines-changed-only: true
          format-review: true      # posts the clang-format diff as a review
          tidy-review: false
          passive-reviews: true
          thread-comments: true

  apply-format:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, 'clang-format-bot apply format') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # 1) Checkout and fetch the PR's merge commit
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch & checkout PR merge commit
        run: |
          # Pull down the special "refs/pull/N/merge" ref
          git fetch origin +refs/pull/${{ github.event.issue.number }}/merge
          git checkout FETCH_HEAD

      # 2) Install clang-format
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      # 3) Apply formatting only to the files changed in this PR
      - name: Apply clang-format
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD \
                    | grep -E '\.(c|h|cpp|hpp)$' || true)
          if [ -z "$FILES" ]; then
            echo "No C/C++ files changed; nothing to format."
            exit 0
          fi
          echo "$FILES" | xargs clang-format -i -style=file
          git config user.name "clang-format-bot"
          git config user.email "clang-format-bot@users.noreply.github.com"
          git add $FILES
          git diff --quiet || git commit -m "Apply clang-format fixes" && git push

